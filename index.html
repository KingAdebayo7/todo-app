
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My To-Do List</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f2;
      color: #24332b;
      min-height: 100vh;
      padding: 40px 16px;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.07);
    }

    .header {
      margin-bottom: 25px;
    }

    .header p {
      color: #748078;
      font-size: 14px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #748078;
      font-size: 14px;
    }

    .task-form {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    #taskInput {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #dce4de;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    #taskInput:focus {
      border-color: #39845d;
      box-shadow: 0 0 0 3px #e0f1e6;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .add-btn {
      background: #286b47;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-weight: bold;
    }

    .add-btn:hover {
      background: #1d5236;
    }

    .task-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .task-summary h2 {
      font-size: 17px;
    }

    #taskCount {
      color: #748078;
      font-size: 13px;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 13px;
      border: 1px solid #dce4de;
      border-radius: 7px;
      background: white;
      color: #536158;
      font-size: 13px;
    }

    .filter-btn.active {
      background: #286b47;
      border-color: #286b47;
      color: white;
    }

    #taskList {
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid #edf0ed;
    }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #286b47;
      flex-shrink: 0;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #9aa49d;
    }

    .delete-btn {
      border: none;
      background: #fff0ef;
      color: #b83d36;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
    }

    .delete-btn:hover {
      background: #fbd9d6;
    }

    .empty-message {
      text-align: center;
      padding: 35px 10px;
      color: #849087;
      font-size: 14px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
      padding-top: 15px;
      border-top: 1px solid #edf0ed;
    }

    .footer p {
      color: #748078;
      font-size: 12px;
    }

    #clearCompleted {
      background: none;
      border: none;
      color: #286b47;
      font-size: 12px;
      font-weight: bold;
    }

    #clearCompleted:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      .app {
        padding: 22px 17px;
      }

      h1 {
        font-size: 26px;
      }

      .add-btn {
        padding: 0 13px;
      }

      .task-summary {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">
      <p id="today"></p>
      <h1>My To-Do List</h1>
      <p class="subtitle">
        Stay organised. One task at a time.
      </p>
    </header>

    <form class="task-form" id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="What needs to get done?"
        maxlength="200"
        autocomplete="off"
        aria-label="New task"
        required
      >

      <button type="submit" class="add-btn">
        + Add
      </button>
    </form>

    <section aria-label="Your tasks">

      <div class="task-summary">
        <h2>Your tasks</h2>
        <span id="taskCount">0 tasks left</span>
      </div>

      <div class="filters" aria-label="Filter tasks">
        <button class="filter-btn active" data-filter="all">
          All
        </button>

        <button class="filter-btn" data-filter="active">
          Active
        </button>

        <button class="filter-btn" data-filter="completed">
          Completed
        </button>
      </div>

      <ul id="taskList"></ul>

      <p id="emptyMessage" class="empty-message">
        No tasks yet. Add your first task above!
      </p>

    </section>

    <footer class="footer">
      <p>Saved automatically in this browser.</p>

      <button id="clearCompleted">
        Clear completed
      </button>
    </footer>

  </main>

  <script>
    // Display today's date.
    const today = new Date();

    document.getElementById("today").textContent =
      today.toLocaleDateString("en-GB", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });

    // Get saved tasks from the browser.
    let tasks = [];

    try {
      const savedTasks = localStorage.getItem("myTodoTasks");
      tasks = savedTasks ? JSON.parse(savedTasks) : [];

      if (!Array.isArray(tasks)) {
        tasks = [];
      }
    } catch (error) {
      tasks = [];
    }

    let currentFilter = "all";

    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const taskCount = document.getElementById("taskCount");
    const emptyMessage = document.getElementById("emptyMessage");

    // Save tasks in the browser.
    function saveTasks() {
      try {
        localStorage.setItem(
          "myTodoTasks",
          JSON.stringify(tasks)
        );
      } catch (error) {
        alert("Your browser could not save the tasks.");
      }
    }

    // Add a new task.
    taskForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = taskInput.value.trim();

      if (text === "") {
        return;
      }

      tasks.unshift({
        id: Date.now().toString() +
            Math.random().toString(36).slice(2),
        text: text,
        completed: false
      });

      saveTasks();
      renderTasks();

      taskInput.value = "";
      taskInput.focus();
    });

    // Mark a task as completed or active.
    function toggleTask(id) {
      tasks = tasks.map(function(task) {
        if (task.id === id) {
          return {
            ...task,
            completed: !task.completed
          };
        }

        return task;
      });

      saveTasks();
      renderTasks();
    }

    // Delete one task.
    function deleteTask(id) {
      tasks = tasks.filter(function(task) {
        return task.id !== id;
      });

      saveTasks();
      renderTasks();
    }

    // Remove all completed tasks.
    document.getElementById("clearCompleted")
      .addEventListener("click", function() {
        tasks = tasks.filter(function(task) {
          return !task.completed;
        });

        saveTasks();
        renderTasks();
      });

    // Change the task filter.
    document.querySelectorAll(".filter-btn")
      .forEach(function(button) {
        button.addEventListener("click", function() {
          currentFilter = button.dataset.filter;

          document.querySelectorAll(".filter-btn")
            .forEach(function(btn) {
              btn.classList.remove("active");
            });

          button.classList.add("active");
          renderTasks();
        });
      });

    // Display tasks on the page.
    function renderTasks() {
      taskList.replaceChildren();

      const visibleTasks = tasks.filter(function(task) {
        if (currentFilter === "active") {
          return !task.completed;
        }

        if (currentFilter === "completed") {
          return task.completed;
        }

        return true;
      });

      const remaining = tasks.filter(function(task) {
        return !task.completed;
      }).length;

      taskCount.textContent =
        remaining + (remaining === 1 ? " task left" : " tasks left");

      emptyMessage.style.display =
        visibleTasks.length === 0 ? "block" : "none";

      if (visibleTasks.length === 0) {
        if (currentFilter === "active" && tasks.length > 0) {
          emptyMessage.textContent = "Great! No active tasks.";
        } else if (currentFilter === "completed" && tasks.length > 0) {
          emptyMessage.textContent = "No completed tasks yet.";
        } else {
          emptyMessage.textContent =
            "No tasks yet. Add your first task above!";
        }
      }

      visibleTasks.forEach(function(task) {
        const item = document.createElement("li");
        item.className = "task-item";

        if (task.completed) {
          item.classList.add("completed");
        }

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute(
          "aria-label",
          "Mark " + task.text + " as completed"
        );

        checkbox.addEventListener("change", function() {
          toggleTask(task.id);
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";
        deleteButton.setAttribute(
          "aria-label",
          "Delete " + task.text
        );

        deleteButton.addEventListener("click", function() {
          deleteTask(task.id);
        });

        item.append(checkbox, text, deleteButton);
        taskList.appendChild(item);
      });
    }

    // Load tasks when the app starts.
    renderTasks();
  </script>

</body>
</html>
